<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Save the Dog - Draw to Save</title>
  <link rel="stylesheet" href="./style.css" />

  <meta name="description" content="Save the Dog - Draw to Save is a polished online HTML5 puzzle game designed to test your spatial reasoning, strategy, and logic. Play full levels free directly in your web browser." />
  <meta name="keywords" content="save the dog - draw to save, save the dog, free online game, brain puzzle, html5 game, logic puzzle" />
  <meta name="game-tags" content="save the dog, save the dog - draw to save, physics puzzle, draw to save" />
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "How do you play Save the Dog - Draw to Save?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Draw a protective line around the doge to defend it against angry bees for 5 seconds."
      }
    }
  ]
}
  </script>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Save the Dog - Draw to Save" />
  <link rel="apple-touch-icon" href="cover.svg" />
</head>
<body>
  <div id="game-stage">
    <header class="header-hud">
      <div class="hud-group">
        <span id="level-badge" class="badge-level">LEVEL 1</span>
        <div class="ink-bar-wrap" title="Remaining Ink">
          <span style="font-size: 11px; font-weight: 800; color: #475569;">INK</span>
          <div class="ink-bar-bg">
            <div id="ink-fill" class="ink-bar-fill"></div>
          </div>
        </div>
        <div id="timer-box" class="timer-box">5.0s</div>
      </div>
      <div class="hud-group">
        <button id="btn-sound" class="btn-tactile" style="width: 38px; padding: 0;" title="Toggle Sound">🔊</button>
        <button id="btn-restart" class="btn-tactile" title="Restart Level">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span class="hidden sm:inline">RESTART</span>
        </button>
      </div>
    </header>

    <div class="canvas-container">
      <div id="instruction-toast" class="instruction-toast">
        ✏️ Draw a protective line for the doge!
      </div>
      <canvas id="game-canvas"></canvas>
    </div>
  </div>

  <script src="./game.js"></script>

  <script>
    (function() {
      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    })();
  </script>

  <!-- 5-Second Hint Ad Modal System -->
  <div id="fl-hint-modal-overlay" style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999999;
    background: rgba(10, 15, 30, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 16px;
    box-sizing: border-box;
  ">
    <div style="
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(245, 158, 11, 0.2);
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 24px;
      text-align: center;
      color: #f8fafc;
      position: relative;
      animation: flModalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    ">
      <!-- Close Button -->
      <button id="fl-hint-close-btn" style="
        position: absolute;
        top: 14px;
        right: 14px;
        background: rgba(255,255,255,0.08);
        border: none;
        color: #94a3b8;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      " onmouseover="this.style.color='#fff';this.style.background='rgba(255,255,255,0.15)'" onmouseout="this.style.color='#94a3b8';this.style.background='rgba(255,255,255,0.08)'">✕</button>

      <!-- Icon -->
      <div style="
        width: 56px;
        height: 56px;
        background: rgba(245, 158, 11, 0.15);
        border: 1px solid rgba(245, 158, 11, 0.3);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 14px auto;
      ">💡</div>

      <!-- Title & Subtitle -->
      <h3 style="margin: 0 0 6px 0; font-size: 19px; font-weight: 800; color: #fbbf24;">Unlocking Hint</h3>
      <p style="margin: 0 0 18px 0; font-size: 13px; color: #94a3b8; line-height: 1.4;">
        Short sponsor break (max 5s) to support free puzzles!
      </p>

      <!-- Ad / Sponsor Banner Box -->
      <div id="fl-hint-ad-box" style="
        background: rgba(0, 0, 0, 0.35);
        border: 1px dashed rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        height: 100px;
        margin-bottom: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: #64748b;
        font-size: 12px;
      ">
        <span style="font-weight: 700; color: #e2e8f0; font-size: 13px;">FunLogic Sponsor Ad</span>
        <span>Ad space placeholder (300x100)</span>
      </div>

      <!-- Progress Bar & Countdown -->
      <div style="margin-bottom: 16px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px;">
          <span>Hint ready in:</span>
          <span id="fl-hint-timer-txt" style="color: #f59e0b;">5s</span>
        </div>
        <div style="width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;">
          <div id="fl-hint-progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #f59e0b, #10b981); border-radius: 4px; transition: width 0.1s linear;"></div>
        </div>
      </div>

      <!-- Action Button -->
      <button id="fl-hint-claim-btn" disabled style="
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: #334155;
        color: #64748b;
        font-size: 14px;
        font-weight: 800;
        cursor: not-allowed;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      ">Please wait 5s...</button>
    </div>
  </div>

  <style>
    @keyframes flModalPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>

  <script>
    (function() {
      let countdownTimer = null;
      let originalHintCallback = null;

      const overlay = document.getElementById('fl-hint-modal-overlay');
      const timerTxt = document.getElementById('fl-hint-timer-txt');
      const progressBar = document.getElementById('fl-hint-progress-bar');
      const claimBtn = document.getElementById('fl-hint-claim-btn');
      const closeBtn = document.getElementById('fl-hint-close-btn');

      function showHintAdModal(callback) {
        if (!overlay) return;
        originalHintCallback = callback;
        overlay.style.display = 'flex';
        
        let timeLeft = 50; // 5.0 seconds (50 x 100ms)
        claimBtn.disabled = true;
        claimBtn.style.background = '#334155';
        claimBtn.style.color = '#64748b';
        claimBtn.style.cursor = 'not-allowed';
        claimBtn.textContent = 'Please wait 5s...';
        progressBar.style.width = '0%';
        timerTxt.textContent = '5s';

        // Notify parent portal
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'hint_ad_started', duration: 5 }, '*');
          }
        } catch(e) {}

        clearInterval(countdownTimer);
        countdownTimer = setInterval(() => {
          timeLeft--;
          const percent = ((50 - timeLeft) / 50) * 100;
          progressBar.style.width = percent + '%';
          const secondsRemaining = Math.ceil(timeLeft / 10);
          timerTxt.textContent = secondsRemaining + 's';
          claimBtn.textContent = 'Please wait ' + secondsRemaining + 's...';

          if (timeLeft <= 0) {
            clearInterval(countdownTimer);
            timerTxt.textContent = 'Ready!';
            timerTxt.style.color = '#10b981';
            claimBtn.disabled = false;
            claimBtn.style.background = 'linear-gradient(90deg, #f59e0b, #10b981)';
            claimBtn.style.color = '#0f172a';
            claimBtn.style.cursor = 'pointer';
            claimBtn.textContent = '✨ Get Hint Now';

            try {
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'hint_ad_completed' }, '*');
              }
            } catch(e) {}
          }
        }, 100);
      }

      function closeHintModal() {
        clearInterval(countdownTimer);
        if (overlay) overlay.style.display = 'none';
      }

      function claimHint() {
        closeHintModal();
        if (typeof originalHintCallback === 'function') {
          originalHintCallback();
        }
      }

      if (closeBtn) closeBtn.addEventListener('click', closeHintModal);
      if (claimBtn) claimBtn.addEventListener('click', claimHint);

      // Expose globally for game engines
      window.showHintWith5sAd = showHintAdModal;

      // Automatically hook into any existing hint button in the DOM
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const hintSelectors = [
            '#btn-hint', '#hint-btn', '#button-hint', '#hint',
            '.btn-hint', '.hint-btn', '[data-action="hint"]',
            'button[title*="Hint" i]', 'button[aria-label*="Hint" i]'
          ];

          hintSelectors.forEach(selector => {
            document.querySelectorAll(selector).forEach(btn => {
              if (!btn.getAttribute('data-fl-hooked')) {
                btn.setAttribute('data-fl-hooked', 'true');
                btn.addEventListener('click', function(e) {
                  // If modal not already claimed in this click
                  if (!this.hasAttribute('data-hint-approved')) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                    showHintAdModal(() => {
                      this.setAttribute('data-hint-approved', 'true');
                      this.click();
                      setTimeout(() => this.removeAttribute('data-hint-approved'), 500);
                    });
                  }
                }, true); // Capture phase to intercept first
              }
            });
          });
        }, 300);
      });
    })();
  </script>

</body>
</html>
