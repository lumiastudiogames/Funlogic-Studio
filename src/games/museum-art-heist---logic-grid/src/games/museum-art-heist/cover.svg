<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(234, 179, 8, 0.25)" />
      <stop offset="100%" stop-color="rgba(234, 179, 8, 0)" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <circle cx="400" cy="220" r="280" fill="url(#spotlight)" />

  <!-- Cork grid lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1.5">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Evidence Red Strings -->
  <g stroke="#ef4444" stroke-width="3.5" fill="none" opacity="0.85">
    <path d="M 220 180 Q 310 240 400 160" />
    <path d="M 400 160 Q 490 230 580 200" />
    <path d="M 220 280 Q 400 320 580 200" stroke="#f43f5e" stroke-dasharray="6,4" />
  </g>

  <!-- Gold Picture Frame in background -->
  <rect x="310" y="80" width="180" height="150" rx="8" fill="#182234" stroke="url(#gold)" stroke-width="6" filter="url(#shadow)" />
  <text x="400" y="165" font-size="54" text-anchor="middle" dominant-baseline="middle">🌌</text>
  <circle cx="400" cy="90" r="5" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />

  <!-- Detective Card Left -->
  <rect x="130" y="130" width="160" height="100" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
  <circle cx="210" cy="140" r="5" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />
  <text x="165" y="180" font-size="32" text-anchor="middle" dominant-baseline="middle">🕵️‍♂️</text>
  <text x="220" y="170" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">DETETIVE</text>
  <text x="220" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Sarah Vance</text>

  <!-- Forensic Clue Card Right -->
  <rect x="510" y="150" width="160" height="100" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)" />
  <circle cx="590" cy="160" r="5" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />
  <text x="545" y="200" font-size="32" text-anchor="middle" dominant-baseline="middle">🧤</text>
  <text x="600" y="190" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">PISTA FORENSE</text>
  <text x="600" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Fibra de Veludo</text>

  <!-- Large Magnifying Glass Center -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="270" r="65" fill="none" stroke="url(#gold)" stroke-width="10" />
    <circle cx="400" cy="270" r="60" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" />
    <path d="M 445 315 L 490 360" stroke="#78350f" stroke-width="16" stroke-linecap="round" />
    <path d="M 445 315 L 490 360" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" />
    <text x="400" y="275" font-size="38" text-anchor="middle" dominant-baseline="middle">✓</text>
  </g>

  <!-- Crime Tape Label -->
  <rect x="180" y="390" width="440" height="42" rx="10" fill="#facc15" filter="url(#shadow)" />
  <text x="400" y="416" fill="#020617" font-family="system-ui, sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="1">
    MUSEUM ART HEIST • LOGIC GRID
  </text>
</svg>
