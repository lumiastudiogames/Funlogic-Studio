<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="250" r="340" fill="url(#glow)"/>

  <!-- Decorative Pattern Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
  </g>

  <!-- Central Glassmorphism Card Frame -->
  <rect x="60" y="50" width="680" height="500" rx="32" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" filter="url(#dropShadow)"/>

  <!-- Category Tag Badge -->
  <rect x="260" y="80" width="280" height="44" rx="22" fill="rgba(56, 189, 248, 0.25)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5"/>
  <text x="400" y="108" fill="#38bdf8" font-size="14" font-weight="900" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="2.5">LIQUID SORT PUZZLE</text>

  <!-- Specialized Dynamic Gameplay Vector Graphic -->
  
      <!-- Glass Test Tubes with Liquid -->
      <g transform="translate(0, -10)">
        <!-- Left Tube -->
        <rect x="250" y="180" width="70" height="180" rx="35" fill="rgba(255,255,255,0.12)" stroke="#38bdf8" stroke-width="4"/>
        <path d="M 254 260 Q 285 250 316 260 L 316 325 A 31 31 0 0 1 254 325 Z" fill="#ec4899"/>
        <path d="M 254 210 Q 285 200 316 210 L 316 260 Q 285 250 254 260 Z" fill="#3b82f6"/>
        <ellipse cx="285" cy="180" rx="35" ry="10" fill="none" stroke="#38bdf8" stroke-width="4"/>

        <!-- Middle Tube (Hero Pours) -->
        <rect x="365" y="160" width="70" height="180" rx="35" fill="rgba(255,255,255,0.15)" stroke="#67e8f9" stroke-width="4" filter="url(#glowEffect)"/>
        <path d="M 369 220 Q 400 210 431 220 L 431 305 A 31 31 0 0 1 369 305 Z" fill="#10b981"/>
        <path d="M 369 180 Q 400 170 431 180 L 431 220 Q 400 210 369 220 Z" fill="#f59e0b"/>
        <ellipse cx="400" cy="160" rx="35" ry="10" fill="none" stroke="#67e8f9" stroke-width="4"/>

        <!-- Right Tube -->
        <rect x="480" y="180" width="70" height="180" rx="35" fill="rgba(255,255,255,0.12)" stroke="#38bdf8" stroke-width="4"/>
        <path d="M 484 280 Q 515 270 546 280 L 546 325 A 31 31 0 0 1 484 325 Z" fill="#a855f7"/>
        <ellipse cx="515" cy="180" rx="35" ry="10" fill="none" stroke="#38bdf8" stroke-width="4"/>

        <!-- Floating Bubbles -->
        <circle cx="400" cy="140" r="8" fill="#a7f3d0" opacity="0.8"/>
        <circle cx="285" cy="155" r="6" fill="#fbcfe8" opacity="0.8"/>
        <circle cx="515" cy="150" r="7" fill="#ddd6fe" opacity="0.8"/>
      </g>

  <!-- Title Text Box -->
  <text x="400" y="445" fill="#ffffff" font-size="34" font-weight="900" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" filter="url(#dropShadow)">Water Sort 12 Tubes (Expert)</text>

  <!-- Eye-Catching Play Pill Button -->
  <rect x="300" y="480" width="200" height="48" rx="24" fill="#38bdf8" filter="url(#glowEffect)"/>
  <text x="400" y="511" fill="#0f172a" font-size="17" font-weight="900" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="1.5">PLAY NOW ▶</text>
</svg>