<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Console Circle Ring -->
  <circle cx="200" cy="150" r="100" fill="#0B0F19" stroke="#334155" stroke-width="8"/>
  
  <!-- Color Pads -->
  <!-- Top Left: Green -->
  <path d="M 200 150 L 120 150 A 80 80 0 0 1 200 70 Z" fill="#22C55E" filter="url(#glow)"/>
  
  <!-- Top Right: Red -->
  <path d="M 200 150 L 200 70 A 80 80 0 0 1 280 150 Z" fill="#EF4444"/>
  
  <!-- Bottom Left: Yellow -->
  <path d="M 200 150 L 120 150 A 80 80 0 0 0 200 230 Z" fill="#EAB308"/>
  
  <!-- Bottom Right: Blue -->
  <path d="M 200 150 L 200 230 A 80 80 0 0 0 280 150 Z" fill="#3B82F6"/>
  
  <!-- Center Core -->
  <circle cx="200" cy="150" r="36" fill="#1E293B" stroke="#475569" stroke-width="4"/>
  <text x="200" y="156" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#58CC02" text-anchor="middle">GO</text>
  
  <!-- Badge -->
  <rect x="20" y="20" width="90" height="28" rx="8" fill="#58CC02"/>
  <text x="65" y="38" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">HTML5 INDEX</text>
</svg>
