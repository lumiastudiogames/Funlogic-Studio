<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ball Bounce Target</title>
    <meta name="description" content="Position deflector blocks to bounce the ball ricocheting into the target basket." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-slate-950 flex items-center justify-center min-h-[100dvh] overflow-hidden select-none m-0 p-0">
    <div id="game-stage" class="w-full h-[100dvh] sm:h-screen lg:h-screen max-w-[min(100vw,calc(100vh*0.88))] mx-auto flex flex-col relative overflow-hidden bg-slate-950 shadow-2xl sm:border-x sm:border-slate-800/80">
      <!-- Injected by game.js -->
    </div>

    <script type="module">
      import { initGame } from './game.js';
      const stage = document.getElementById('game-stage');
      initGame(stage);
    </script>
  </body>
</html>
