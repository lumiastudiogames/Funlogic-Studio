<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009c3b"/>
      <stop offset="100%" stop-color="#006622"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bg)"/>
  <!-- Diamond -->
  <polygon points="200,45 360,150 200,255 40,150" fill="#fedf00" filter="url(#shadow)"/>
  <!-- Blue Circle -->
  <circle cx="200" cy="150" r="65" fill="#002776" filter="url(#shadow)"/>
  <!-- White Arc -->
  <path d="M 140,165 Q 200,120 260,140" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Question mark and stars -->
  <text x="200" y="162" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle">?</text>
  <text x="200" y="285" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">QUIZ BRASIL</text>
</svg>
