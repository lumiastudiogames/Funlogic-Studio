<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Node 1 Blue Grad -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Node 2 Red Grad -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Node 3 Amber Grad -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Node 4 Green Grad -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" />

  <!-- Board Matrix Grid Lines -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="2">
    <line x1="96" y1="128" x2="416" y2="128" />
    <line x1="96" y1="208" x2="416" y2="208" />
    <line x1="96" y1="288" x2="416" y2="288" />
    <line x1="96" y1="368" x2="416" y2="368" />

    <line x1="128" y1="96" x2="128" y2="416" />
    <line x1="208" y1="96" x2="208" y2="416" />
    <line x1="288" y1="96" x2="288" y2="416" />
    <line x1="368" y1="96" x2="368" y2="416" />
  </g>

  <!-- Connected Pipe: Blue Flow (1) -->
  <path d="M 128 128 L 128 288 L 208 288 L 208 208 L 288 208 L 288 128" 
        fill="none" stroke="#2563eb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 128 128 L 128 288 L 208 288 L 208 208 L 288 208 L 288 128" 
        fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Connected Pipe: Red Flow (2) -->
  <path d="M 368 128 L 368 288 L 288 288 L 288 368" 
        fill="none" stroke="#dc2626" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 368 128 L 368 288 L 288 288 L 288 368" 
        fill="none" stroke="#f87171" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Connected Pipe: Green Flow (3) -->
  <path d="M 128 368 L 208 368" 
        fill="none" stroke="#16a34a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 128 368 L 208 368" 
        fill="none" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Number Endpoints with 2.5D Spheres -->
  <!-- 1 Blue -->
  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="30" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
    <text x="128" y="137" fill="#ffffff" font-size="24" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">1</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="288" cy="128" r="30" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
    <text x="288" y="137" fill="#ffffff" font-size="24" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">1</text>
  </g>

  <!-- 2 Red -->
  <g filter="url(#shadow)">
    <circle cx="368" cy="128" r="30" fill="url(#redGrad)" stroke="#ffffff" stroke-width="2" />
    <text x="368" y="137" fill="#ffffff" font-size="24" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">2</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="288" cy="368" r="30" fill="url(#redGrad)" stroke="#ffffff" stroke-width="2" />
    <text x="288" y="377" fill="#ffffff" font-size="24" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">2</text>
  </g>

  <!-- 3 Green -->
  <g filter="url(#shadow)">
    <circle cx="128" cy="368" r="30" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="2" />
    <text x="128" y="377" fill="#ffffff" font-size="24" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">3</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="208" cy="368" r="30" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="2" />
    <text x="208" y="377" fill="#ffffff" font-size="24" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">3</text>
  </g>

  <!-- Title Bottom Banner -->
  <text x="256" y="460" fill="#38bdf8" font-size="28" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="2">
    NUMBER LINK FLOW
  </text>
</svg>
