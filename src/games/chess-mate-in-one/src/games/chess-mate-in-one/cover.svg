<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53341b" />
      <stop offset="100%" stop-color="#331e0d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />

  <!-- Subtle chessboard pattern in background -->
  <g opacity="0.08">
    <rect x="50" y="50" width="50" height="50" fill="#ffffff" />
    <rect x="150" y="50" width="50" height="50" fill="#ffffff" />
    <rect x="250" y="50" width="50" height="50" fill="#ffffff" />
    <rect x="350" y="50" width="50" height="50" fill="#ffffff" />
    <rect x="450" y="50" width="50" height="50" fill="#ffffff" />
    <rect x="100" y="100" width="50" height="50" fill="#ffffff" />
    <rect x="200" y="100" width="50" height="50" fill="#ffffff" />
    <rect x="300" y="100" width="50" height="50" fill="#ffffff" />
    <rect x="400" y="100" width="50" height="50" fill="#ffffff" />
    <rect x="50" y="150" width="50" height="50" fill="#ffffff" />
    <rect x="150" y="150" width="50" height="50" fill="#ffffff" />
    <rect x="250" y="150" width="50" height="50" fill="#ffffff" />
    <rect x="350" y="150" width="50" height="50" fill="#ffffff" />
    <rect x="100" y="200" width="50" height="50" fill="#ffffff" />
    <rect x="200" y="200" width="50" height="50" fill="#ffffff" />
    <rect x="300" y="200" width="50" height="50" fill="#ffffff" />
    <rect x="400" y="200" width="50" height="50" fill="#ffffff" />
  </g>

  <!-- Central Chessboard Perspective -->
  <g transform="translate(160, 60)" filter="url(#shadow)">
    <!-- Board Base -->
    <rect x="0" y="0" width="280" height="280" rx="20" fill="url(#boardGrad)" stroke="#eab308" stroke-width="2" stroke-opacity="0.4" />
    <!-- Squares 4x4 Mini preview -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="60" height="60" fill="#f5efe6" />
      <rect x="60" y="0" width="60" height="60" fill="#8d5b36" />
      <rect x="120" y="0" width="60" height="60" fill="#f5efe6" />
      <rect x="180" y="0" width="60" height="60" fill="#8d5b36" />

      <rect x="0" y="60" width="60" height="60" fill="#8d5b36" />
      <rect x="60" y="60" width="60" height="60" fill="#f5efe6" />
      <rect x="120" y="60" width="60" height="60" fill="#8d5b36" />
      <rect x="180" y="60" width="60" height="60" fill="#f5efe6" />

      <rect x="0" y="120" width="60" height="60" fill="#f5efe6" />
      <rect x="60" y="120" width="60" height="60" fill="#8d5b36" />
      <rect x="120" y="120" width="60" height="60" fill="#f5efe6" />
      <rect x="180" y="120" width="60" height="60" fill="#8d5b36" />

      <rect x="0" y="180" width="60" height="60" fill="#8d5b36" />
      <rect x="60" y="180" width="60" height="60" fill="#f5efe6" />
      <rect x="120" y="180" width="60" height="60" fill="#8d5b36" />
      <rect x="180" y="180" width="60" height="60" fill="#f5efe6" />
    </g>

    <!-- Black King in corner -->
    <text x="230" y="65" font-size="44" text-anchor="middle" fill="#111827">♚</text>
    <text x="230" y="65" font-size="44" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="1.5">♚</text>

    <!-- White Queen delivering mate -->
    <text x="230" y="125" font-size="44" text-anchor="middle" fill="#ffffff">♕</text>
    <text x="230" y="125" font-size="44" text-anchor="middle" fill="none" stroke="#1e293b" stroke-width="1.5">♕</text>

    <!-- Knight Icon Badge -->
    <circle cx="80" cy="190" r="32" fill="url(#goldGrad)" filter="url(#shadow)" />
    <text x="80" y="202" font-size="36" text-anchor="middle" fill="#1e293b">♞</text>
  </g>

  <!-- Title & Subtitle Banner -->
  <g transform="translate(300, 360)">
    <rect x="-180" y="-30" width="360" height="50" rx="25" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="0" y="3" font-family="system-ui, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      CHESS MATE IN ONE
    </text>
  </g>
</svg>
