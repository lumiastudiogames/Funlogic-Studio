<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Train Body Gradients -->
    <linearGradient id="redTrainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="blueTrainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <linearGradient id="yellowTrainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Steel Rail Gradient -->
    <linearGradient id="steelRail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Tunnel Abyss Glow -->
    <radialGradient id="tunnelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>

    <!-- Headlight Cone -->
    <linearGradient id="headlightBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(254, 240, 138, 0.7)" />
      <stop offset="100%" stop-color="rgba(254, 240, 138, 0)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />

  <!-- Ballast Grid Texture -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="250" x2="600" y2="250" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="350" x2="600" y2="350" />
  </g>

  <!-- Parallel Tracks -->
  <!-- Track 1 Sleepers & Rails -->
  <g>
    <!-- Sleepers -->
    <rect x="20" y="85" width="560" height="30" fill="rgba(30, 41, 59, 0.6)" rx="4" />
    <!-- Steel Rails -->
    <line x1="20" y1="92" x2="540" y2="92" stroke="url(#steelRail)" stroke-width="4" />
    <line x1="20" y1="108" x2="540" y2="108" stroke="url(#steelRail)" stroke-width="4" />
  </g>

  <!-- Track 2 Sleepers & Rails -->
  <g>
    <rect x="20" y="185" width="560" height="30" fill="rgba(30, 41, 59, 0.6)" rx="4" />
    <line x1="20" y1="192" x2="540" y2="192" stroke="url(#steelRail)" stroke-width="4" />
    <line x1="20" y1="208" x2="540" y2="208" stroke="url(#steelRail)" stroke-width="4" />
  </g>

  <!-- Track 3 Sleepers & Rails -->
  <g>
    <rect x="20" y="285" width="560" height="30" fill="rgba(30, 41, 59, 0.6)" rx="4" />
    <line x1="20" y1="292" x2="540" y2="292" stroke="url(#steelRail)" stroke-width="4" />
    <line x1="20" y1="308" x2="540" y2="308" stroke="url(#steelRail)" stroke-width="4" />
  </g>

  <!-- Switch Turnout Diagonal Crossovers -->
  <path d="M 180 100 C 260 100, 300 200, 380 200" fill="none" stroke="url(#steelRail)" stroke-width="4" />
  <path d="M 280 200 C 340 200, 380 300, 440 300" fill="none" stroke="url(#steelRail)" stroke-width="4" />

  <!-- Switch LED Indicator Badges -->
  <g transform="translate(260, 135)">
    <rect x="-18" y="-12" width="36" height="24" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">↘</text>
  </g>

  <!-- Tunnels on the right -->
  <g transform="translate(520, 75)">
    <rect x="0" y="0" width="80" height="50" rx="14" fill="url(#tunnelGlow)" stroke="#ef4444" stroke-width="3" />
    <rect x="6" y="16" width="30" height="18" rx="4" fill="#991b1b" stroke="#fca5a5" stroke-width="1" />
    <text x="21" y="29" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">M1</text>
  </g>

  <g transform="translate(520, 175)">
    <rect x="0" y="0" width="80" height="50" rx="14" fill="url(#tunnelGlow)" stroke="#3b82f6" stroke-width="3" />
    <rect x="6" y="16" width="30" height="18" rx="4" fill="#1e40af" stroke="#93c5fd" stroke-width="1" />
    <text x="21" y="29" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">M2</text>
  </g>

  <g transform="translate(520, 275)">
    <rect x="0" y="0" width="80" height="50" rx="14" fill="url(#tunnelGlow)" stroke="#eab308" stroke-width="3" />
    <rect x="6" y="16" width="30" height="18" rx="4" fill="#854d0e" stroke="#fde047" stroke-width="1" />
    <text x="21" y="29" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">M4</text>
  </g>

  <!-- Train 1 (Red 3-Car Train navigating crossover) -->
  <g transform="translate(230, 150) rotate(32)">
    <!-- Headlight Beam -->
    <polygon points="35,-10 130,-30 130,30 35,10" fill="url(#headlightBeam)" />
    
    <!-- Engine Car -->
    <rect x="-30" y="-12" width="60" height="24" rx="6" fill="url(#redTrainGrad)" stroke="#1e293b" stroke-width="1.5" />
    <!-- Windows -->
    <rect x="-16" y="-8" width="8" height="4" fill="#fef08a" />
    <rect x="-2" y="-8" width="8" height="4" fill="#fef08a" />
    <rect x="12" y="-8" width="8" height="4" fill="#0284c7" rx="2" />
    <!-- Headlight bulb -->
    <circle cx="28" cy="-5" r="2.5" fill="#ffffff" />
    <circle cx="28" cy="5" r="2.5" fill="#ffffff" />
  </g>

  <!-- Train 2 (Blue Express Train) -->
  <g transform="translate(100, 200)">
    <!-- Car 1 (Rear) -->
    <rect x="-95" y="-12" width="55" height="24" rx="6" fill="url(#blueTrainGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="-85" y="-8" width="7" height="4" fill="#fef08a" />
    <rect x="-70" y="-8" width="7" height="4" fill="#fef08a" />
    <rect x="-55" y="-8" width="7" height="4" fill="#fef08a" />

    <!-- Coupler -->
    <line x1="-40" y1="0" x2="-30" y2="0" stroke="#000000" stroke-width="6" />

    <!-- Car 2 (Lead Engine) -->
    <rect x="-30" y="-12" width="60" height="24" rx="6" fill="url(#blueTrainGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="-16" y="-8" width="8" height="4" fill="#fef08a" />
    <rect x="-2" y="-8" width="8" height="4" fill="#fef08a" />
    <rect x="14" y="-8" width="8" height="4" fill="#0284c7" rx="2" />
    <circle cx="28" cy="-5" r="2.5" fill="#ffffff" />
    <circle cx="28" cy="5" r="2.5" fill="#ffffff" />
  </g>

  <!-- Title & Typography -->
  <g transform="translate(30, 45)">
    <text x="0" y="0" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5">METRO SUBWAY</text>
    <text x="0" y="18" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">TRAIN YARD DISPATCHER • 30 LEVELS</text>
  </g>
</svg>
