<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tile2048" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="tile64" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />

  <g transform="translate(180, 200)" filter="url(#shadow)">
    <rect width="130" height="130" rx="28" fill="#fb923c" />
    <text x="65" y="78" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">8</text>
  </g>

  <g transform="translate(335, 170)" filter="url(#shadow)">
    <rect width="160" height="160" rx="36" fill="url(#tile2048)" />
    <text x="80" y="72" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#713f12" text-anchor="middle">🍉</text>
    <text x="80" y="116" font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#713f12" text-anchor="middle">2048</text>
  </g>

  <g transform="translate(520, 200)" filter="url(#shadow)">
    <rect width="130" height="130" rx="28" fill="url(#tile64)" />
    <text x="65" y="78" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">64</text>
  </g>

  <text x="400" y="420" font-family="system-ui, sans-serif" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    MERGE 2048
  </text>
  <text x="400" y="465" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#bae6fd" text-anchor="middle" letter-spacing="4">
