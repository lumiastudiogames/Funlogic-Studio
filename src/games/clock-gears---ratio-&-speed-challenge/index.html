<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Clock Gears Ratio & Speed Challenge — FunLogic.games</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="game-container">
    <header class="game-header">
      <div class="header-left">
        <h1 class="game-title">⚙️ Clock Gears</h1>
        <div class="level-indicator">Level <span id="current-level">1</span> / 10</div>
      </div>
      <div class="header-stats">
        <div class="stat-box">Target: <span id="target-speed" class="highlight">2x</span></div>
        <div class="stat-box">Score: <span id="score-val">0</span></div>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gears-canvas"></canvas>
    </div>

    <div class="control-panel">
      <p class="instruction-text" id="instruction-text">Select the gear to connect the driver to the clock hand!</p>
      <div class="gears-selector" id="gears-selector"></div>
      <div class="action-buttons">
        <button id="btn-test" class="btn btn-primary">Test Gear Train ▶</button>
        <button id="btn-reset" class="btn btn-secondary">Reset</button>
      </div>
    </div>
  </div>

  <script src="./game.js"></script>
</body>
</html>
