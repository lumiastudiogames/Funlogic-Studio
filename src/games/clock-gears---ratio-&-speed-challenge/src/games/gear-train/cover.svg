<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a1f18" />
      <stop offset="60%" stop-color="#18110d" />
      <stop offset="100%" stop-color="#0a0705" />
    </radialGradient>
    <linearGradient id="goldGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="30%" stop-color="#d4a036" />
      <stop offset="70%" stop-color="#9a6e1a" />
      <stop offset="100%" stop-color="#5a3d08" />
    </linearGradient>
    <linearGradient id="copperGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb894" />
      <stop offset="35%" stop-color="#c86d43" />
      <stop offset="75%" stop-color="#8a3f1b" />
      <stop offset="100%" stop-color="#4a1f0a" />
    </linearGradient>
    <linearGradient id="steelPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3b32" />
      <stop offset="50%" stop-color="#2c221b" />
      <stop offset="100%" stop-color="#1a130f" />
    </linearGradient>
    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.8" />
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Victorian Corner Filigree & Border -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#684a2d" stroke-width="3" opacity="0.6"/>
  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#d4a036" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.4"/>

  <!-- Left Motor Gear (Gold 24T) -->
  <g transform="translate(300, 240)" filter="url(#gearShadow)">
    <!-- Teeth -->
    <g fill="url(#goldGear)" stroke="#ffeaa7" stroke-width="1">
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" />
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" transform="rotate(30)" />
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" transform="rotate(60)" />
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" transform="rotate(90)" />
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" transform="rotate(120)" />
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" transform="rotate(150)" />
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" transform="rotate(180)" />
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" transform="rotate(210)" />
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" transform="rotate(240)" />
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" transform="rotate(270)" />
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" transform="rotate(300)" />
      <path d="M-12,-110 L12,-110 L9,-90 L-9,-90 Z" transform="rotate(330)" />
      <circle r="92" />
    </g>
    <!-- Gear Rim & Spokes -->
    <circle r="72" fill="#1e1510" stroke="#d4a036" stroke-width="4" />
    <!-- Spokes -->
    <rect x="-6" y="-70" width="12" height="140" fill="url(#goldGear)" rx="3" />
    <rect x="-6" y="-70" width="12" height="140" fill="url(#goldGear)" rx="3" transform="rotate(60)" />
    <rect x="-6" y="-70" width="12" height="140" fill="url(#goldGear)" rx="3" transform="rotate(120)" />
    <!-- Central Hub & Rivets -->
    <circle r="34" fill="url(#goldGear)" stroke="#ffeaa7" stroke-width="2" />
    <circle r="14" fill="#120c08" stroke="#d4a036" stroke-width="3" />
    <circle cx="0" cy="-22" r="3" fill="#ffeaa7" />
    <circle cx="22" cy="0" r="3" fill="#ffeaa7" />
    <circle cx="0" cy="22" r="3" fill="#ffeaa7" />
    <circle cx="-22" cy="0" r="3" fill="#ffeaa7" />
  </g>

  <!-- Right Driven Gear (Copper 36T) -->
  <g transform="translate(500, 240)" filter="url(#gearShadow)">
    <g fill="url(#copperGear)" stroke="#ffcfb8" stroke-width="1">
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(15)" />
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(45)" />
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(75)" />
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(105)" />
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(135)" />
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(165)" />
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(195)" />
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(225)" />
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(255)" />
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(285)" />
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(315)" />
      <path d="M-14,-130 L14,-130 L11,-108 L-11,-108 Z" transform="rotate(345)" />
      <circle r="110" />
    </g>
    <!-- Gear Rim & Spokes -->
    <circle r="88" fill="#1e1510" stroke="#c86d43" stroke-width="5" />
    <rect x="-8" y="-86" width="16" height="172" fill="url(#copperGear)" rx="4" />
    <rect x="-8" y="-86" width="16" height="172" fill="url(#copperGear)" rx="4" transform="rotate(45)" />
    <rect x="-8" y="-86" width="16" height="172" fill="url(#copperGear)" rx="4" transform="rotate(90)" />
    <rect x="-8" y="-86" width="16" height="172" fill="url(#copperGear)" rx="4" transform="rotate(135)" />
    <!-- Hub -->
    <circle r="40" fill="url(#copperGear)" stroke="#ffcfb8" stroke-width="2" />
    <circle r="16" fill="#120c08" stroke="#c86d43" stroke-width="3" />
  </g>

  <!-- Sparkle & Kinetic Energy Meshing Point -->
  <g transform="translate(398, 240)" filter="url(#glow)">
    <circle r="8" fill="#ffeaa7" opacity="0.9" />
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#ffd166" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#ffd166" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 75)">
    <rect x="-260" y="-38" width="520" height="76" rx="14" fill="url(#steelPlate)" stroke="#d4a036" stroke-width="3" filter="url(#gearShadow)" />
    <rect x="-252" y="-30" width="504" height="60" rx="8" fill="none" stroke="#ffd166" stroke-width="1" opacity="0.5" />
    <text x="0" y="8" font-family="'Georgia', serif" font-size="34" font-weight="900" fill="#ffd166" text-anchor="middle" letter-spacing="3" filter="url(#glow)">
      GEAR TRAIN COGS
    </text>
    <text x="0" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ffb894" text-anchor="middle" letter-spacing="4">
      RATIO &amp; TORQUE PHYSICS
    </text>
  </g>

  <!-- Bottom Tagline Pill -->
  <g transform="translate(400, 430)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1b120c" stroke="#684a2d" stroke-width="2" />
    <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e6ca98" text-anchor="middle">
      ⚙️ TRANSMITA VELOCIDADE &amp; TORQUE
    </text>
  </g>
</svg>
