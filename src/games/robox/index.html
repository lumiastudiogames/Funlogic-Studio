<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Robox - Quebra-Cabeça de Empurrar Caixas 2.5D</title>
  <link rel="stylesheet" href="./style.css" />
  <meta name="description" content="Robox é um jogo de quebra-cabeça clássico Sokoban em 2.5D. Empurre as caixas de energia para os nós de recarga usando raciocínio lógico." />
  <meta name="keywords" content="robox, sokoban, quebra-cabeça, puzzle, empurrar caixas, logica, 2.5d" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Robox" />
  <link rel="apple-touch-icon" href="cover.svg" />
</head>
<body>
  <div id="game-stage">
    <header class="header-hud">
      <div class="hud-group">
        <span id="level-badge" class="badge-level">LEVEL 1</span>
        <span id="step-count" class="step-counter">0 STEPS</span>
      </div>
      <div class="hud-group">
        <button id="btn-sound" class="btn-tactile" style="width: 38px; padding: 0;" title="Sound">🔊</button>
        <button id="btn-undo" class="btn-tactile" disabled title="Undo move">UNDO</button>
        <button id="btn-restart" class="btn-tactile" title="Restart level">RESTART</button>
      </div>
    </header>

    <div class="board-container" id="board-touch-area">
      <div id="board" class="grid-board"></div>
      <div class="drag-hint">Swipe to move the robot or push boxes</div>
    </div>

    <!-- Win Modal Overlay -->
    <div id="modal-win" class="overlay">
      <div class="modal-card">
        <div class="modal-trophy">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2">
            <path d="M6 9V2h12v7a6 6 0 0 1-12 0Z"/>
            <path d="M18 4h3a2 2 0 0 1 2 2v1a4 4 0 0 1-4 4h-1"/>
            <path d="M6 4H3a2 2 0 0 0-2 2v1a4 4 0 0 0 4 4h1"/>
            <path d="M12 15v5"/>
            <path d="M8 22h8"/>
          </svg>
        </div>
        <div class="modal-title">Level Complete!</div>
        <p class="modal-desc">You solved the puzzle in <span id="win-steps" class="win-highlight">0</span> steps!</p>
        <div class="modal-actions">
          <button id="btn-win-restart" class="btn-tactile btn-modal-retry">RESTART</button>
          <button id="btn-win-next" class="btn-tactile btn-modal-next">NEXT LEVEL</button>
        </div>
      </div>
    </div>

  </div>

  <script src="./game.js"></script>
</body>
</html>
