<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Hacker Logic - Decode</title>
  <link rel="stylesheet" href="./style.css" />

  <meta name="description" content="Hacker Logic - Decode: crack ASCII hex-encoded words against the clock. Study the translation map, decode the payload, type the hidden word. 50 hacker levels." />
  <meta name="keywords" content="hacker logic, hex decode, ascii puzzle, cipher game, code game, hacker puzzle, brain game" />
  <meta name="game-tags" content="hacker logic, hacker logic - decode, brain puzzle, brain game, brain logic, cipher, hex decode, ascii game, coding game, decode game, hacker game, cryptography game, logic puzzle, logic game, iq puzzle, iq game" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#051009" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hacker Logic" />
  <link rel="apple-touch-icon" href="cover.svg" />
</head>
<body>
  <div id="game-stage">

    <!-- HUD Header -->
    <header class="header-hud">
      <div class="hud-group">
        <button id="btn-levels-modal" class="btn-tactile" style="background:rgba(34,197,94,0.2);color:#86efac;border-color:#16a34a;font-size:11px;">
          📂 LVL <span id="level-num">1</span>/50
        </button>
        <span id="timer-badge" class="badge-timer">⏱ 90s</span>
      </div>
      <div class="hud-group">
        <button id="btn-map" class="btn-tactile" style="background:rgba(14,165,233,0.2);color:#38bdf8;border-color:#0284c7;font-size:11px;">
          📖 HEX MAP
        </button>
        <button id="btn-sound" class="btn-tactile" style="width:34px;padding:0;">🔊</button>
        <button id="btn-restart" class="btn-tactile">↺ RST</button>
      </div>
    </header>

    <!-- Encoded Hex Payload Display -->
    <div class="encoded-zone">
      <div class="encoded-label">&gt; ENCODED PAYLOAD:</div>
      <div id="encoded-display" class="encoded-display">—</div>
      <div id="hint-text" class="hint-text">💡 —</div>
    </div>

    <!-- Terminal Log -->
    <div id="history-logs" class="terminal-history"></div>

    <!-- Letter Input Slots -->
    <div id="input-display" class="input-display"></div>

    <!-- A–Z Keypad -->
    <div class="keypad-outer">
      <div id="alpha-keypad" class="alpha-keypad"></div>
      <div class="keypad-actions">
        <button id="btn-del"   class="btn-key action-del">⌫ DEL</button>
        <button id="btn-enter" class="btn-key action-enter">DECODE ↵</button>
      </div>
    </div>

    <!-- Levels Modal -->
    <div id="modal-levels" class="levels-modal-overlay" style="display:none;">
      <div class="levels-modal-content">
        <div class="modal-header">
          <h3>SELECT LEVEL (1–50)</h3>
          <button id="btn-close-levels" class="btn-close-modal">✕</button>
        </div>
        <div id="levels-grid" class="levels-grid"></div>
      </div>
    </div>

    <!-- Hex Map Modal -->
    <div id="map-modal" class="levels-modal-overlay" style="display:none;">
      <div class="levels-modal-content map-modal-content">
        <div class="modal-header">
          <h3>📖 ASCII HEX MAP — A to Z</h3>
          <button id="btn-close-map" class="btn-close-modal">✕</button>
        </div>
        <div id="map-content" class="map-content"></div>
      </div>
    </div>

  </div><!-- #game-stage -->

  <script src="./game.js"></script>

  <script>
    (function() {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    })();
  </script>

  <!-- 5-Second Hint Ad Modal System -->
  <div id="fl-hint-modal-overlay" style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999999;
    background: rgba(10, 15, 30, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 16px;
    box-sizing: border-box;
  ">
    <div style="
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(245, 158, 11, 0.2);
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 24px;
      text-align: center;
      color: #f8fafc;
      position: relative;
      animation: flModalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    ">
      <button id="fl-hint-close-btn" style="
        position: absolute; top: 14px; right: 14px;
        background: rgba(255,255,255,0.08); border: none; color: #94a3b8;
        width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px;
        display: flex; align-items: center; justify-content: center; transition: all 0.2s;
      ">✕</button>
      <div style="width:56px;height:56px;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;">💡</div>
      <h3 style="margin:0 0 6px;font-size:19px;font-weight:800;color:#fbbf24;">Unlocking Hint</h3>
      <p style="margin:0 0 18px;font-size:13px;color:#94a3b8;line-height:1.4;">Short sponsor break (max 5s) to support free puzzles!</p>
      <div id="fl-hint-ad-box" style="background:rgba(0,0,0,0.35);border:1px dashed rgba(255,255,255,0.12);border-radius:12px;height:100px;margin-bottom:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#64748b;font-size:12px;">
        <span style="font-weight:700;color:#e2e8f0;font-size:13px;">FunLogic Sponsor Ad</span>
        <span>Ad space placeholder (300x100)</span>
      </div>
      <div style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#cbd5e1;margin-bottom:6px;">
          <span>Hint ready in:</span><span id="fl-hint-timer-txt" style="color:#f59e0b;">5s</span>
        </div>
        <div style="width:100%;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;">
          <div id="fl-hint-progress-bar" style="width:0%;height:100%;background:linear-gradient(90deg,#f59e0b,#10b981);border-radius:4px;transition:width 0.1s linear;"></div>
        </div>
      </div>
      <button id="fl-hint-claim-btn" disabled style="width:100%;padding:12px;border-radius:12px;border:none;background:#334155;color:#64748b;font-size:14px;font-weight:800;cursor:not-allowed;transition:all 0.2s;text-transform:uppercase;letter-spacing:0.5px;">Please wait 5s...</button>
    </div>
  </div>
  <style>
    @keyframes flModalPop { 0%{transform:scale(0.85);opacity:0} 100%{transform:scale(1);opacity:1} }
  </style>
  <script>
    (function() {
      let countdownTimer = null, originalHintCallback = null;
      const overlay = document.getElementById('fl-hint-modal-overlay');
      const timerTxt = document.getElementById('fl-hint-timer-txt');
      const progressBar = document.getElementById('fl-hint-progress-bar');
      const claimBtn = document.getElementById('fl-hint-claim-btn');
      const closeBtn = document.getElementById('fl-hint-close-btn');
      function showHintAdModal(cb) {
        if (!overlay) return; originalHintCallback = cb; overlay.style.display = 'flex';
        let timeLeft = 50; claimBtn.disabled = true; claimBtn.style.background = '#334155'; claimBtn.style.color = '#64748b'; claimBtn.style.cursor = 'not-allowed'; claimBtn.textContent = 'Please wait 5s...'; progressBar.style.width = '0%'; timerTxt.textContent = '5s';
        clearInterval(countdownTimer);
        countdownTimer = setInterval(() => {
          timeLeft--;
          const pct = ((50-timeLeft)/50)*100; progressBar.style.width = pct+'%';
          const s = Math.ceil(timeLeft/10); timerTxt.textContent = s+'s'; claimBtn.textContent = 'Please wait '+s+'s...';
          if (timeLeft <= 0) {
            clearInterval(countdownTimer); timerTxt.textContent = 'Ready!'; timerTxt.style.color = '#10b981';
            claimBtn.disabled = false; claimBtn.style.background = 'linear-gradient(90deg,#f59e0b,#10b981)'; claimBtn.style.color = '#0f172a'; claimBtn.style.cursor = 'pointer'; claimBtn.textContent = '✨ Get Hint Now';
          }
        }, 100);
      }
      function closeHintModal() { clearInterval(countdownTimer); if (overlay) overlay.style.display = 'none'; }
      function claimHint() { closeHintModal(); if (typeof originalHintCallback === 'function') originalHintCallback(); }
      if (closeBtn) closeBtn.addEventListener('click', closeHintModal);
      if (claimBtn) claimBtn.addEventListener('click', claimHint);
      window.showHintWith5sAd = showHintAdModal;
    })();
  </script>
</body>
</html>
