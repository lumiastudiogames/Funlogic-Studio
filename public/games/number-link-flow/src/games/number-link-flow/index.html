<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Number Link Flow</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="game-container"></div>
  <script type="module">
    import { render } from './game.js';
    render(document.getElementById('game-container'), (time) => {
      window.parent.postMessage({ type: 'win', time }, '*');
    });
  </script>
</body>
</html>
