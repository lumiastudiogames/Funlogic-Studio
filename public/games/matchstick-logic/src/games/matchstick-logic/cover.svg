<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="woodGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef9ee" />
      <stop offset="50%" stop-color="#faeed9" />
      <stop offset="100%" stop-color="#e9d6bc" />
    </radialGradient>
    <linearGradient id="stickBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <radialGradient id="sulfurHead" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="35%" stop-color="#dc2626" />
      <stop offset="75%" stop-color="#881337" />
      <stop offset="100%" stop-color="#3f0713" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#3a2512" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Board -->
  <rect width="600" height="400" fill="url(#woodGrad)" rx="24" />
  
  <!-- Title Badge -->
  <g transform="translate(300, 70)">
    <rect x="-140" y="-25" width="280" height="50" rx="25" fill="#0f172a" filter="url(#shadow)" />
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">MATCHSTICK LOGIC</text>
  </g>

  <!-- Matchsticks Equation: 6 + 3 = 9 -->
  <g transform="translate(70, 150)" filter="url(#shadow)">
    <!-- Digit 6 -->
    <!-- Seg a -->
    <rect x="10" y="0" width="60" height="12" rx="4" fill="url(#stickBody)" />
    <rect x="60" y="-1" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- Seg b -->
    <rect x="0" y="10" width="12" height="60" rx="4" fill="url(#stickBody)" />
    <rect x="-1" y="60" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- Seg d -->
    <rect x="10" y="70" width="60" height="12" rx="4" fill="url(#stickBody)" />
    <rect x="60" y="69" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- Seg e -->
    <rect x="0" y="80" width="12" height="60" rx="4" fill="url(#stickBody)" />
    <rect x="-1" y="80" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- Seg f -->
    <rect x="68" y="80" width="12" height="60" rx="4" fill="url(#stickBody)" />
    <rect x="67" y="130" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- Seg g -->
    <rect x="10" y="140" width="60" height="12" rx="4" fill="url(#stickBody)" />
    <rect x="10" y="139" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
  </g>

  <!-- Operator + -->
  <g transform="translate(195, 215)" filter="url(#shadow)">
    <rect x="-30" y="-6" width="60" height="12" rx="4" fill="url(#stickBody)" />
    <rect x="20" y="-7" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <rect x="-6" y="-30" width="12" height="60" rx="4" fill="url(#stickBody)" />
    <rect x="-7" y="20" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
  </g>

  <!-- Digit 3 -->
  <g transform="translate(260, 150)" filter="url(#shadow)">
    <!-- a -->
    <rect x="10" y="0" width="60" height="12" rx="4" fill="url(#stickBody)" />
    <rect x="60" y="-1" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- c -->
    <rect x="68" y="10" width="12" height="60" rx="4" fill="url(#stickBody)" />
    <rect x="67" y="60" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- d -->
    <rect x="10" y="70" width="60" height="12" rx="4" fill="url(#stickBody)" />
    <rect x="10" y="69" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- f -->
    <rect x="68" y="80" width="12" height="60" rx="4" fill="url(#stickBody)" />
    <rect x="67" y="130" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- g -->
    <rect x="10" y="140" width="60" height="12" rx="4" fill="url(#stickBody)" />
    <rect x="60" y="139" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
  </g>

  <!-- Operator = -->
  <g transform="translate(385, 215)" filter="url(#shadow)">
    <rect x="-25" y="-18" width="50" height="11" rx="4" fill="url(#stickBody)" />
    <rect x="15" y="-19" width="13" height="13" rx="6.5" fill="url(#sulfurHead)" />
    <rect x="-25" y="8" width="50" height="11" rx="4" fill="url(#stickBody)" />
    <rect x="15" y="7" width="13" height="13" rx="6.5" fill="url(#sulfurHead)" />
  </g>

  <!-- Digit 9 -->
  <g transform="translate(445, 150)" filter="url(#shadow)">
    <!-- a -->
    <rect x="10" y="0" width="60" height="12" rx="4" fill="url(#stickBody)" />
    <rect x="60" y="-1" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- b -->
    <rect x="0" y="10" width="12" height="60" rx="4" fill="url(#stickBody)" />
    <rect x="-1" y="10" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- c -->
    <rect x="68" y="10" width="12" height="60" rx="4" fill="url(#stickBody)" />
    <rect x="67" y="60" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- d -->
    <rect x="10" y="70" width="60" height="12" rx="4" fill="url(#stickBody)" />
    <rect x="60" y="69" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- f -->
    <rect x="68" y="80" width="12" height="60" rx="4" fill="url(#stickBody)" />
    <rect x="67" y="130" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
    <!-- g -->
    <rect x="10" y="140" width="60" height="12" rx="4" fill="url(#stickBody)" />
    <rect x="10" y="139" width="14" height="14" rx="7" fill="url(#sulfurHead)" />
  </g>

  <!-- Subtitle pill -->
  <g transform="translate(300, 355)">
    <rect x="-110" y="-15" width="220" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">20 PROGRESSIVE LEVELS</text>
  </g>
</svg>
