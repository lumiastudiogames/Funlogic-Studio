<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="carRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="carYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="carBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />

  <!-- Road markings -->
  <line x1="50" y1="50" x2="550" y2="50" stroke="#334155" stroke-width="4" stroke-dasharray="16,12" />
  <line x1="50" y1="350" x2="550" y2="350" stroke="#334155" stroke-width="4" stroke-dasharray="16,12" />

  <!-- Parking Bay Lines -->
  <rect x="120" y="80" width="360" height="240" rx="12" fill="#182234" stroke="#475569" stroke-width="3" />
  <line x1="240" y1="80" x2="240" y2="320" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="360" y1="80" x2="360" y2="320" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="120" y1="200" x2="480" y2="200" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Car 1: Yellow Taxi Driving Out -->
  <g filter="url(#shadow)" transform="translate(380, 110)">
    <!-- Shadow -->
    <ellipse cx="40" cy="50" rx="42" ry="24" fill="rgba(0,0,0,0.5)" />
    <!-- Body -->
    <rect x="0" y="10" width="80" height="44" rx="8" fill="url(#carYellow)" />
    <!-- Glass -->
    <rect x="15" y="16" width="50" height="32" rx="4" fill="#0f172a" />
    <!-- Roof -->
    <rect x="25" y="20" width="30" height="24" rx="2" fill="#1e293b" />
    <!-- Taxi Sign -->
    <rect x="33" y="12" width="14" height="6" rx="1" fill="#fef08a" />
    <!-- Arrow -->
    <path d="M 95,32 L 130,32 M 120,24 L 130,32 L 120,40" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Car 2: Red Sedan -->
  <g filter="url(#shadow)" transform="translate(150, 100) rotate(90)">
    <ellipse cx="40" cy="50" rx="40" ry="22" fill="rgba(0,0,0,0.5)" />
    <rect x="0" y="12" width="76" height="42" rx="8" fill="url(#carRed)" />
    <rect x="16" y="18" width="44" height="30" rx="4" fill="#0f172a" />
    <rect x="24" y="22" width="28" height="22" rx="2" fill="#7f1d1d" />
  </g>

  <!-- Car 3: Blue Delivery Van -->
  <g filter="url(#shadow)" transform="translate(250, 190)">
    <ellipse cx="60" cy="45" rx="55" ry="22" fill="rgba(0,0,0,0.5)" />
    <rect x="0" y="12" width="110" height="42" rx="6" fill="url(#carBlue)" />
    <rect x="15" y="18" width="80" height="30" rx="4" fill="#0f172a" />
    <rect x="25" y="22" width="60" height="22" rx="2" fill="#1e293b" />
  </g>

  <!-- Traffic Cone -->
  <g transform="translate(170, 240)">
    <rect x="0" y="0" width="28" height="28" rx="3" fill="#ea580c" />
    <circle cx="14" cy="14" r="11" fill="#c2410c" />
    <circle cx="14" cy="14" r="7" fill="#ffffff" />
    <circle cx="14" cy="14" r="3" fill="#ea580c" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 48)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <text x="0" y="6" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">
      CITY PARKING <tspan fill="#60a5fa">JAM</tspan>
    </text>
  </g>
</svg>
