<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mask-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58CC02"/>
      <stop offset="100%" stop-color="#46A302"/>
    </linearGradient>
  </defs>
  <!-- Full Bleed Background -->
  <rect width="512" height="512" fill="url(#mask-grad)"/>
  
  <!-- Outer Ring for alignment / safe zone hint (subtle) -->
  <circle cx="256" cy="256" r="160" fill="#ffffff" fill-opacity="0.08" />
  
  <!-- Safe Zone centered F character -->
  <text x="256" y="340" font-family="Plus Jakarta Sans, Outfit, system-ui, -apple-system, sans-serif" font-weight="900" font-size="240" fill="#FFFFFF" text-anchor="middle" letter-spacing="-5">F</text>
</svg>
